networks:
  inception:
    driver: bridge

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/fadarwis/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/fadarwis/data/mariadb

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

services:
  nginx:
    build: ./requirements/nginx
    image: nginx
    networks:
      - inception
    restart: always
    ports:
      - "443:443"
    volumes:
      - wp_data:/farah/shared/path

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - inception
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file: .env
    secrets:
      - db_password
      - db_root_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    networks:
      - inception
    restart: always
    volumes:
      - wp_data:/farah/shared/path
    env_file: .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
